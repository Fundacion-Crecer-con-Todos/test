<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Próximamente | Primero LEE</title>
  <meta
    name="description"
    content="Sitio en construcción - Fundación Educacional Crecer con Todos"
  />

  <style>
    :root {
      --bg: #13b7d4;
      --text: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.82);
      --line: rgba(255, 255, 255, 0.32);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 1500px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 72px 60px 30px;
      display: flex;
      flex-direction: column;
    }

    .hero {
      max-width: 820px;
    }

    .hero h1 {
      font-size: clamp(58px, 7vw, 96px);
      line-height: 0.98;
      letter-spacing: -0.045em;
      font-weight: 700;
      margin-bottom: 30px;
    }

    .hero p {
      max-width: 760px;
      font-size: clamp(21px, 2vw, 27px);
      line-height: 1.5;
      color: var(--text-soft);
      margin-bottom: 30px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      font-size: 15px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      background: white;
      border-radius: 50%;
    }

    .bottom {
      margin-top: auto;
      padding-top: 90px;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 90px;
      align-items: end;
    }

    .brand-image {
      width: 100%;
      max-width: 720px;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .social-list {
      list-style: none;
    }

    .social-list li {
      border-bottom: 1px solid var(--line);
    }

    .social-list a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      color: white;
      text-decoration: none;
      font-size: 24px;
      transition: opacity 0.2s ease;
    }

    .social-list a:hover {
      opacity: 0.7;
    }

    .arrow {
      font-size: 30px;
    }

    .footer {
      margin-top: 42px;
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      gap: 24px;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.9);
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 800px) {
      .page {
        padding: 42px 22px 24px;
      }

      .hero h1 {
        font-size: 52px;
      }

      .hero p {
        font-size: 20px;
      }

      .bottom {
        grid-template-columns: 1fr;
        gap: 50px;
      }

      .brand-image {
        max-width: 100%;
      }

      .social-list a {
        font-size: 21px;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="hero">
      <h1>
        Estamos construyendo<br />
        algo nuevo.
      </h1>

      <p>
        Muy pronto podrás conocer la nueva experiencia digital de Primero LEE
        y Fundación Educacional Crecer con Todos.
      </p>

      <div class="status">
        <span class="status-dot"></span>
        Sitio en construcción
      </div>
    </section>

    <section class="bottom">

      <div>
        <img
          src="/assets/logos-crecer-primerolee.avif"
          alt="Fundación Educacional Crecer con Todos y Primero LEE"
          class="brand-image"
        />
      </div>

      <ul class="social-list">
        <li>
          <a
            href="https://www.instagram.com/primerolee/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span>Instagram</span>
            <span class="arrow">→</span>
          </a>
        </li>

        <li>
          <a
            href="https://www.linkedin.com/company/fundaci%C3%B3n-educacional-crecer-con-todos"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span>LinkedIn</span>
            <span class="arrow">→</span>
          </a>
        </li>
      </ul>

    </section>

    <footer class="footer">
      <p>© 2026 Fundación Crecer con Todos.</p>

      <p>
        Diseño y Desarrollo por
        <a
          href="https://lowsignal.cl"
          target="_blank"
          rel="noopener noreferrer"
        >
          lowsignal
        </a>
      </p>
    </footer>

  </main>
</body>
</html>
