<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Próximamente | Fundación Crecer con Todos</title>

  <meta
    name="description"
    content="Estamos construyendo la nueva experiencia digital de Fundación Educacional Crecer con Todos y Primero LEE."
  />

  <meta name="theme-color" content="#13b7d4" />

  <style>
    :root {
      --bg: #13b7d4;
      --text: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.82);
      --line: rgba(255, 255, 255, 0.32);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .bg-shapes {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .shape {
      position: absolute;
      border-radius: 18px;
      opacity: 0.16;
      filter: saturate(0.95);
      animation: drift 16s ease-in-out infinite alternate;
    }

    .shape.s1 {
      width: 110px;
      height: 110px;
      background: #864490;
      top: 10%;
      right: 12%;
      animation-delay: -3s;
    }

    .shape.s2 {
      width: 72px;
      height: 150px;
      background: #ff870d;
      top: 34%;
      right: 4%;
      animation-delay: -8s;
    }

    .shape.s3 {
      width: 92px;
      height: 92px;
      background: #c051a0;
      bottom: 18%;
      left: 6%;
      animation-delay: -5s;
    }

    .shape.s4 {
      width: 150px;
      height: 72px;
      background: #75c832;
      bottom: 7%;
      left: 32%;
      animation-delay: -11s;
    }

    .shape.s5 {
      width: 76px;
      height: 76px;
      background: #5943a5;
      top: 56%;
      left: 2%;
      animation-delay: -7s;
    }

    @keyframes drift {
      from {
        transform: translate3d(0, 0, 0) rotate(0deg);
      }
      to {
        transform: translate3d(18px, -24px, 0) rotate(8deg);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes softFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .page {
      width: 100%;
      max-width: 1500px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 72px 60px 30px;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .hero {
      animation: fadeUp 0.8s ease-out both;
    }

    .hero p {
      animation: fadeUp 0.8s ease-out 0.08s both;
    }

    .status {
      animation: fadeUp 0.8s ease-out 0.16s both;
    }

    .bottom {
      animation: fadeUp 0.9s ease-out 0.24s both;
    }

    .hero {
      max-width: 820px;
    }

    .hero h1 {
      font-size: clamp(58px, 7vw, 96px);
      line-height: 0.98;
      letter-spacing: -0.045em;
      font-weight: 700;
      margin-bottom: 30px;
    }

    .hero p {
      max-width: 760px;
      font-size: clamp(21px, 2vw, 27px);
      line-height: 1.5;
      color: var(--text-soft);
      margin-bottom: 30px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      font-size: 15px;
      backdrop-filter: blur(6px);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      background: white;
      border-radius: 50%;
    }

    .bottom {
      margin-top: auto;
      padding-top: 90px;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 90px;
      align-items: end;
    }

    .brand-image {
      width: 100%;
      max-width: 720px;
      height: auto;
      display: block;
      object-fit: contain;
      animation: softFloat 6s ease-in-out infinite;
      will-change: transform;
    }

    .social-list {
      list-style: none;
    }

    .social-list li {
      border-bottom: 1px solid var(--line);
    }

    .social-list a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      color: white;
      text-decoration: none;
      font-size: 24px;
      transition:
        opacity 0.2s ease,
        padding-left 0.2s ease;
    }

    .social-list a:hover {
      opacity: 0.72;
      padding-left: 6px;
    }

    .arrow {
      font-size: 30px;
      transition: transform 0.2s ease;
    }

    .social-list a:hover .arrow {
      transform: translateX(5px);
    }

    .footer {
      margin-top: 42px;
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      gap: 24px;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.9);
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-width: 800px) {
      .page {
        padding: 42px 22px 24px;
      }

      .hero h1 {
        font-size: 52px;
      }

      .hero p {
        font-size: 20px;
      }

      .bottom {
        grid-template-columns: 1fr;
        gap: 50px;
        padding-top: 70px;
      }

      .brand-image {
        max-width: 100%;
      }

      .social-list a {
        font-size: 21px;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="bg-shapes" aria-hidden="true">
    <span class="shape s1"></span>
    <span class="shape s2"></span>
    <span class="shape s3"></span>
    <span class="shape s4"></span>
    <span class="shape s5"></span>
  </div>

  <main class="page">

    <section class="hero">
      <h1>
        Estamos construyendo<br />
        algo nuevo.
      </h1>

      <p>
        Muy pronto podrás conocer la nueva experiencia digital de Primero LEE
        y Fundación Educacional Crecer con Todos.
      </p>

      <div class="status">
        <span class="status-dot"></span>
        Sitio en construcción
      </div>
    </section>

    <section class="bottom">

      <div>
        <img
          src="/assets/logo-b-fcct.png"
          alt="Fundación Educacional Crecer con Todos y Primero LEE"
          class="brand-image"
        />
      </div>

      <ul class="social-list">
        <li>
          <a
            href="https://www.instagram.com/primerolee/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span>Instagram</span>
            <span class="arrow">→</span>
          </a>
        </li>

        <li>
          <a
            href="https://www.linkedin.com/company/fundaci%C3%B3n-educacional-crecer-con-todos"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span>LinkedIn</span>
            <span class="arrow">→</span>
          </a>
        </li>
      </ul>

    </section>

    <footer class="footer">
      <p>© 2026 Fundación Crecer con Todos.</p>

      <p>
        Diseño y Desarrollo por
        <a
          href="https://lowsignal.cl"
          target="_blank"
          rel="noopener noreferrer"
        >
          lowsignal
        </a>
      </p>
    </footer>

  </main>
</body>
</html>
