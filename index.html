<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Próximamente | Fundación Crecer con Todos</title>

  <meta
    name="description"
    content="Estamos construyendo la nueva experiencia digital de Fundación Educacional Crecer con Todos y Primero LEE."
  />

  <meta name="theme-color" content="#13b7d4" />

  <style>
    :root {
      --bg: #13b7d4;
      --text: #ffffff;
      --text-soft: rgba(255,255,255,.82);
      --line: rgba(255,255,255,.24);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    .page {
      width: 100%;
      height: 100vh;
      max-width: 1500px;
      margin: 0 auto;
      padding: 48px 60px 28px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 26px;
    }

    .hero {
      max-width: 780px;
    }

    .hero h1 {
      font-size: clamp(52px, 5.7vw, 82px);
      line-height: .98;
      letter-spacing: -.045em;
      font-weight: 700;
      margin-bottom: 22px;
      animation: fadeUp .8s ease-out both;
    }

    .hero p {
      max-width: 700px;
      font-size: clamp(18px, 1.65vw, 23px);
      line-height: 1.5;
      color: var(--text-soft);
      margin-bottom: 22px;
      animation: fadeUp .8s ease-out .08s both;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 15px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      font-size: 13px;
      animation: fadeUp .8s ease-out .16s both;
      backdrop-filter: blur(6px);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 12px rgba(255,255,255,.7);
    }

    .progress {
      margin-top: 26px;
      width: 100%;
      height: 18px;
      position: relative;
      display: flex;
      align-items: center;
      animation: fadeUp .8s ease-out .22s both;
    }

    .progress-track {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,.20);
      position: relative;
      overflow: hidden;
    }

    .progress-glow {
      position: absolute;
      top: 50%;
      left: 0;
      width: 28%;
      height: 1px;
      margin-top: -.5px;
      background: white;
      box-shadow: 0 0 18px rgba(255,255,255,.7);
      animation: sweep 3.8s ease-in-out infinite;
    }

    .progress-dot {
      position: absolute;
      top: 50%;
      left: 0;
      width: 6px;
      height: 6px;
      margin-top: -3px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 14px rgba(255,255,255,.8);
      animation: dotMove 3.8s ease-in-out infinite;
    }

    @keyframes sweep {
      0%   { transform: translateX(-120%); opacity: .15; }
      30%  { opacity: 1; }
      100% { transform: translateX(430%); opacity: .25; }
    }

    @keyframes dotMove {
      0%   { left: 0%; opacity: .2; }
      15%  { opacity: 1; }
      100% { left: 100%; opacity: .3; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .middle {
      align-self: end;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr);
      gap: 80px;
      align-items: end;
      animation: fadeUp .9s ease-out .26s both;
    }

    .brand-group {
      display: flex;
      align-items: flex-end;
      gap: 26px;
      min-width: 0;
    }

    .brand-image {
      width: min(520px, 100%);
      height: auto;
      display: block;
      object-fit: contain;
    }

    .collab-block {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 6px;
      flex-wrap: wrap;
    }

    .collab-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: rgba(255,255,255,.58);
      white-space: nowrap;
    }

    .collab-sep {
      color: rgba(255,255,255,.35);
      font-size: 24px;
      font-weight: 300;
    }

    .lowsignal-logo {
      display: block;
      width: 138px;
      max-height: 34px;
      object-fit: contain;
      object-position: left center;
      transition: opacity .2s ease, transform .2s ease;
    }

    .lowsignal-logo:hover {
      opacity: .78;
      transform: translateY(-1px);
    }

    .social-list {
      list-style: none;
      width: 100%;
      max-width: 430px;
      margin-left: auto;
    }

    .social-list li {
      border-bottom: 1px solid var(--line);
    }

    .social-list a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 0;
      color: white;
      text-decoration: none;
      font-size: 15px;
      transition: opacity .2s ease, transform .2s ease;
    }

    .social-list a:hover {
      opacity: .72;
      transform: translateX(3px);
    }

    .social-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .social-icon {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 50%;
      background: rgba(255,255,255,.045);
    }

    .social-icon svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .arrow {
      width: 18px;
      height: 18px;
      display: block;
      flex: 0 0 auto;
      transition: transform .2s ease;
    }

    .arrow path {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .social-list a:hover .arrow {
      transform: translate(2px,-2px);
    }

    .footer {
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,.16);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      font-size: 12px;
      color: rgba(255,255,255,.68);
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    .footer a:hover {
      color: white;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .page {
        height: auto;
        min-height: 100vh;
        padding: 42px 28px 24px;
        grid-template-rows: auto auto auto;
      }

      .middle {
        grid-template-columns: 1fr;
        gap: 42px;
        align-self: auto;
        margin-top: 40px;
      }

      .brand-group {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }

      .social-list {
        margin-left: 0;
      }
    }

    @media (max-width: 700px) {
      .page {
        padding: 36px 20px 22px;
      }

      .hero h1 {
        font-size: 48px;
      }

      .hero p {
        font-size: 18px;
      }

      .brand-image {
        width: 100%;
        max-width: 440px;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="hero">
      <h1>
        Estamos construyendo<br />
        algo nuevo.
      </h1>

      <p>
        Muy pronto podrás conocer la nueva experiencia digital de Primero LEE
        y Fundación Educacional Crecer con Todos.
      </p>

      <div class="status">
        <span class="status-dot"></span>
        Sitio en construcción
      </div>

      <div class="progress" aria-hidden="true">
        <div class="progress-track"></div>
        <span class="progress-glow"></span>
        <span class="progress-dot"></span>
      </div>
    </section>

    <section class="middle">
      <div class="brand-group">
        <img
          src="/assets/logo-b-fcct.png"
          alt="Fundación Educacional Crecer con Todos y Primero LEE"
          class="brand-image"
        />

        <div class="collab-block">
          <span class="collab-label">En colaboración con</span>
          <span class="collab-sep">|</span>

          <a
            href="https://lowsignal.cl"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="lowsignal"
          >
            <img
              src="/assets/lowsignal-logo-white.png"
              alt="lowsignal"
              class="lowsignal-logo"
            />
          </a>
        </div>
      </div>

      <ul class="social-list">
        <li>
          <a
            href="https://www.instagram.com/primerolee/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="social-left">
              <span class="social-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M7.75 2h8.5A5.76 5.76 0 0 1 22 7.75v8.5A5.76 5.76 0 0 1 16.25 22h-8.5A5.76 5.76 0 0 1 2 16.25v-8.5A5.76 5.76 0 0 1 7.75 2Zm0 2A3.75 3.75 0 0 0 4 7.75v8.5A3.75 3.75 0 0 0 7.75 20h8.5A3.75 3.75 0 0 0 20 16.25v-8.5A3.75 3.75 0 0 0 16.25 4h-8.5ZM17.5 5.5A1.25 1.25 0 1 1 17.5 8a1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/>
                </svg>
              </span>
              <span>Instagram</span>
            </span>
            <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 17L17 7M9 7h8v8"/>
            </svg>
          </a>
        </li>

        <li>
          <a
            href="https://www.linkedin.com/company/fundaci%C3%B3n-educacional-crecer-con-todos"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="social-left">
              <span class="social-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M5.4 8.5H2V22h3.4V8.5ZM3.7 2A2 2 0 1 0 3.7 6a2 2 0 0 0 0-4ZM22 14.3c0-4.1-2.2-6-5.1-6-2.4 0-3.4 1.3-4 2.2V8.5H9.5V22h3.4v-6.7c0-1.8.3-3.5 2.6-3.5s2.3 2.1 2.3 3.6V22H22v-7.7Z"/>
                </svg>
              </span>
              <span>LinkedIn</span>
            </span>
            <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 17L17 7M9 7h8v8"/>
            </svg>
          </a>
        </li>
      </ul>
    </section>

    <footer class="footer">
      <p>© 2026 Fundación Crecer con Todos.</p>
      <p>Nueva experiencia digital en desarrollo.</p>
    </footer>

  </main>
</body>
</html>
