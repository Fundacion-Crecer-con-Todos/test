<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Cobertura territorial de Primero LEE en Chile</title>
  <desc id="desc">Mapa geográfico de Chile con regiones destacadas y llamados laterales.</desc>
  <defs>
    <filter id="mapGray" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.78  0 0 0 0 0.80  0 0 0 0 0.82  0 0 0 1 0"/>
    </filter>
    <filter id="mapTeal" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.67  0 0 0 0 0.61  0 0 0 1 0"/>
    </filter>
    <clipPath id="activeBands">
      <rect x="414" y="120" width="170" height="74" rx="4"/>
      <rect x="414" y="205" width="170" height="72" rx="4"/>
      <rect x="414" y="287" width="170" height="64" rx="4"/>
      <rect x="414" y="359" width="170" height="56" rx="4"/>
      <rect x="414" y="423" width="170" height="58" rx="4"/>
      <rect x="414" y="489" width="170" height="62" rx="4"/>
      <rect x="414" y="559" width="170" height="62" rx="4"/>
      <rect x="414" y="629" width="170" height="64" rx="4"/>
    </clipPath>
  </defs>

  <rect width="1000" height="760" rx="28" fill="#F5F6FB"/>

  <!-- Real geographic Chile silhouette -->
  <g>
    <image href="https://commons.wikimedia.org/wiki/Special:Redirect/file/Chile_blank_map.svg"
      x="390" y="38" width="220" height="684" preserveAspectRatio="xMidYMid meet" filter="url(#mapGray)"/>
    <g clip-path="url(#activeBands)">
      <image href="https://commons.wikimedia.org/wiki/Special:Redirect/file/Chile_blank_map.svg"
        x="390" y="38" width="220" height="684" preserveAspectRatio="xMidYMid meet" filter="url(#mapTeal)"/>
    </g>
  </g>

  <!-- Orange anchors -->
  <g fill="#F28A31">
    <circle cx="500" cy="156" r="5"/>
    <circle cx="500" cy="240" r="5"/>
    <circle cx="500" cy="318" r="5"/>
    <circle cx="500" cy="387" r="5"/>
    <circle cx="500" cy="451" r="5"/>
    <circle cx="500" cy="519" r="5"/>
    <circle cx="500" cy="590" r="5"/>
    <circle cx="500" cy="662" r="5"/>
  </g>

  <!-- Leader lines -->
  <g fill="none" stroke="#F28A31" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500 156H330L284 112H64"/>
    <path d="M500 240H666L712 148H934"/>
    <path d="M500 318H330L284 270H64"/>
    <path d="M500 387H668L714 312H934"/>
    <path d="M500 451H668L714 432H934"/>
    <path d="M500 519H330L284 500H64"/>
    <path d="M500 590H668L714 570H934"/>
    <path d="M500 662H330L284 636H64"/>
  </g>

  <!-- Region names only -->
  <g font-family="Fredoka, Arial, sans-serif" fill="#374151" font-size="21" font-weight="650">
    <text x="64" y="101">Región de Atacama</text>
    <text x="712" y="137">Región de Antofagasta</text>
    <text x="64" y="259">Región de Valparaíso</text>
    <text x="714" y="301">Región Metropolitana</text>
    <text x="714" y="421">Región del Maule</text>
    <text x="64" y="489">Región de La Araucanía</text>
    <text x="714" y="559">Región del Biobío</text>
    <text x="64" y="625">Región de Los Lagos</text>
  </g>

  <g stroke="#F28A31" stroke-width="2" stroke-linecap="round">
    <path d="M64 112h220"/>
    <path d="M712 148h222"/>
    <path d="M64 270h220"/>
    <path d="M714 312h220"/>
    <path d="M714 432h220"/>
    <path d="M64 500h220"/>
    <path d="M714 570h220"/>
    <path d="M64 636h220"/>
  </g>
</svg>